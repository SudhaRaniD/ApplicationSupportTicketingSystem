
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Support Dashboard</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <h1>Application Support Dashboard</h1>
    <p>Welcome to the IT Support Ticketing System</p>

    <!-- <div id="dashboard">
        <h2>Ticket Overview</h2>
        <p>Dashboard statistics will appear here.</p>
    </div> -->

    
<div id="dashboard">
    <h2>Ticket Overview</h2>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Tickets</h3>
            <p id="total">0</p>
        </div>

        <div class="stat-card">
            <h3>Open</h3>
            <p id="open">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="in_progress">0</p>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <p id="resolved">0</p>
        </div>

        <div class="stat-card">
            <h3>Closed</h3>
            <p id="closed">0</p>
        </div>

        <div class="stat-card">
            <h3>Critical</h3>
            <p id="critical">0</p>
        </div>

        <div class="stat-card">
            <h3>Overdue</h3>
            <p id="overdue">0</p>
        </div>
    </div>
</div>


    <script src="../static/js/script.js"></script>
</body>
</html>
